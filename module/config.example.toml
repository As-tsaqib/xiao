[gateway]
enabled = true
auto_restart = true

[daemon]
log_level = "info"

[agent]
max_turns = 150
max_tool_calls = 256
max_no_progress_repeats = 3
max_runtime_seconds = 1800
context_max_chars = 32000
summary_threshold_chars = 24000
tool_output_max_chars = 4096
max_parallel_readonly_tools = 8
max_execution_plan_steps = 32
provider_streaming = true
parallel_readonly_tools = true
execution_plan_enabled = true
plan_cache_enabled = true
background_learning = true

[attachments]
max_image_bytes = 20971520
max_document_bytes = 52428800
max_session_bytes = 209715200
max_image_pixels = 40000000
max_extracted_text_chars = 2000000
chunk_chars = 4000
retrieval_chunks = 6
processing_timeout_seconds = 30

[telegram]
enabled = false
transport = "long_polling"

[telegram.access]
allowed_chat_ids = []
# owner_user_id = 123456789 # required for Telegram; one canonical owner

[telegram.ui]
menu_ttl_seconds = 900
progress_detail = "normal"
menu_close_behavior = "keep_summary"

[ipc]
bind = "127.0.0.1:37921"

[storage]
database = "/data/adb/xiao/data/xiao.db"

[paths]
data_dir = "/data/adb/xiao"
logs_dir = "/data/adb/xiao/logs"
secrets_dir = "/data/adb/xiao/secrets"

[providers.codex]
enabled = true
default_model = "gpt-5.6-sol"
# Keep base_url unset to use the built-in ChatGPT Codex transport adapter.

[providers.antigravity]
enabled = true
default_model = "gemini-pro-agent"
# Keep base_url unset to use the built-in Antigravity stream adapter.
# Login works out of the box with CLIProxyAPI-compatible installed-app OAuth.
# Set oauth_client_id only to override it with your own Desktop OAuth client;
# its optional secret belongs in SecretStore through the root admin API.
oauth_client_id = ""

[providers.custom]
enabled = false
name = "Custom"
protocol = "openai_chat_completions"
models = []

[providers.custom.headers]
# Non-secret custom headers only. Store API keys through WebUI/SecretStore.
