[package]
name = "xiao-gateway"
version = "0.2.6"
edition = "2021"
license = "MIT"
description = "Xiao private Telegram-first personal AI agent for rooted Android"
repository = "https://github.com/As-tsaqib/xiao"

[lib]
name = "xiao"
path = "src/lib.rs"

[[bin]]
name = "xiaod"
path = "src/main.rs"

[[bin]]
name = "xiao"
path = "src/bin_cli.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.19"
libc = "0.2"
pdf-extract = "0.12"
quick-xml = "0.38"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
