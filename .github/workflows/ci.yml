name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-v027:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/v0.2.7-control-plane-unification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - name: Apply checksum-bound v0.2.7 implementation patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/READY ]]; then
            echo "No ready patch; nothing to apply."
            exit 0
          fi
          test -f .bootstrap/SHA256
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name '*.xz.b64.*' -print | sort)
          (( ${#parts[@]} > 0 ))
          cat "${parts[@]}" | tr -d '\n\r' | base64 --decode | xz --decompress > /tmp/v027.patch
          sha256sum --check .bootstrap/SHA256
          git apply --check /tmp/v027.patch
          git apply /tmp/v027.patch
          rm -rf .bootstrap
          git diff --check
          node --check module/webroot/assets/app.js
          ./scripts/acceptance.sh --static-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: unify Xiao v0.2.7 control plane and CLI'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi

  rust:
    needs: bootstrap-v027
    if: always() && (needs.bootstrap-v027.result == 'success' || needs.bootstrap-v027.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - run: ./scripts/acceptance.sh --static-only

  android-arm64:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Resolve artifact name
        id: module
        run: |
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xiao-v${version}-kernelsu-arm64.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify deterministic module ZIP
        env:
          MODULE_ARCHIVE: ${{ steps.module.outputs.archive }}
        run: |
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$MODULE_ARCHIVE.sha256")
          unzip -t "dist/$MODULE_ARCHIVE"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: xiao-v${{ steps.module.outputs.version }}-kernelsu-arm64
          if-no-files-found: error
          path: |
            dist/${{ steps.module.outputs.archive }}
            dist/${{ steps.module.outputs.archive }}.sha256
