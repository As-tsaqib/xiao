name: ci
on:
  push:
    branches:
      - feat/v0.2.7-control-plane-unification
  pull_request:
  workflow_dispatch:

# Temporary pre-release validation workflow. Write permission, source
# normalization, push trigger, and the status report are removed after all
# supported release gates pass.
permissions:
  contents: write

jobs:
  pre-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: aarch64-linux-android
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck

      - name: Normalize compiler and WebUI contract fixes
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          providers = Path("src/providers/mod.rs")
          text = providers.read_text()
          signature = "pub(crate) async fn probe_custom_tool_capability("
          if signature in text and "#[cfg(test)]\n" + signature not in text:
              text = text.replace(signature, "#[cfg(test)]\n" + signature, 1)
              providers.write_text(text)

          app = Path("module/webroot/assets/app.js")
          text = app.read_text()
          if "managerPost('provider-custom'" not in text:
              anchor = "function showProviderError(error) { notice(`Could not load providers: ${error.message}`, 'bad'); }\n\n"
              helper = """async function mutateCustomProvider(body, success) {
            if (state.busy) return;
            setBusy(true); notice('Applying Custom provider change through xiaod…');
            try { await managerPost('provider-custom', body); notice(success, 'good'); }
            catch (error) { console.error('Xiao Custom provider action failed:', error); notice(`Action failed: ${error.message}`, 'bad'); setBusy(false); return; }
            setBusy(false); await refreshCurrent();
          }

          """
              if anchor not in text:
                  raise SystemExit("Custom provider helper insertion anchor missing")
              text = text.replace(anchor, anchor + helper, 1)
              expected = text.count("await mutate('provider-custom', ")
              if expected != 4:
                  raise SystemExit(f"expected four Custom mutate callsites, found {expected}")
              text = text.replace("await mutate('provider-custom', ", "await mutateCustomProvider(")
              if "mutate('provider-custom'" in text:
                  raise SystemExit("generic Custom mutation call remains")
              app.write_text(text)
          PY
          cargo clippy --fix --locked --all-targets --all-features --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs' module/webroot/assets/app.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use explicit Custom WebUI manager action'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi

      - name: Shellcheck POSIX scripts
        id: shell_posix
        continue-on-error: true
        run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - name: Shellcheck Bash scripts
        id: shell_bash
        continue-on-error: true
        run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - name: Rustfmt
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Cargo check
        id: check
        continue-on-error: true
        run: cargo check --locked --all-targets --all-features
      - name: Cargo clippy strict
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Cargo test
        id: test
        continue-on-error: true
        run: cargo test --locked --all-targets --all-features
      - name: Cargo release build
        id: release
        continue-on-error: true
        run: cargo build --locked --release --all-features
      - name: Check WebUI JavaScript
        id: node_app
        continue-on-error: true
        run: node --check module/webroot/assets/app.js
      - name: Check KernelSU bridge JavaScript
        id: node_ksu
        continue-on-error: true
        run: node --check module/webroot/assets/ksu-bridge.js
      - name: Static acceptance
        id: acceptance
        continue-on-error: true
        run: ./scripts/acceptance.sh --static-only
      - name: Install cargo-ndk
        id: ndk_install
        continue-on-error: true
        run: cargo install cargo-ndk --locked
      - name: Android arm64 cross-build
        id: android
        continue-on-error: true
        run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Build deterministic KernelSU module
        id: package
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          archive="xiao-v${version}-kernelsu-arm64.zip"
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$archive" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$archive" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$archive.sha256")
          unzip -t "dist/$archive"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Persist deterministic pre-release status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat > .ci/pre-release-status.txt <<'EOF'
          shell_posix=${{ steps.shell_posix.outcome }}
          shell_bash=${{ steps.shell_bash.outcome }}
          rustfmt=${{ steps.rustfmt.outcome }}
          check=${{ steps.check.outcome }}
          clippy=${{ steps.clippy.outcome }}
          test=${{ steps.test.outcome }}
          release=${{ steps.release.outcome }}
          node_app=${{ steps.node_app.outcome }}
          node_ksu=${{ steps.node_ksu.outcome }}
          acceptance=${{ steps.acceptance.outcome }}
          ndk_install=${{ steps.ndk_install.outcome }}
          android=${{ steps.android.outcome }}
          package=${{ steps.package.outcome }}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/pre-release-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record pre-release gate outcomes'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi

      - name: Enforce pre-release gate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for outcome in \
            '${{ steps.shell_posix.outcome }}' \
            '${{ steps.shell_bash.outcome }}' \
            '${{ steps.rustfmt.outcome }}' \
            '${{ steps.check.outcome }}' \
            '${{ steps.clippy.outcome }}' \
            '${{ steps.test.outcome }}' \
            '${{ steps.release.outcome }}' \
            '${{ steps.node_app.outcome }}' \
            '${{ steps.node_ksu.outcome }}' \
            '${{ steps.acceptance.outcome }}' \
            '${{ steps.ndk_install.outcome }}' \
            '${{ steps.android.outcome }}' \
            '${{ steps.package.outcome }}'; do
            test "$outcome" = success
          done
