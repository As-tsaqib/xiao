name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-json-contract:
    if: github.event.pull_request.head.ref == 'feat/v0.2.7-control-plane-unification' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - name: Rustfmt and enforce architecture JSON envelopes
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/bin_cli.rs')
          text = path.read_text()
          old = '''type CliResult<T> = std::result::Result<T, CliFailure>;

struct CliPresenter {
'''
          new = '''type CliResult<T> = std::result::Result<T, CliFailure>;

fn cli_success_json(data: Value) -> Value {
    json!({"status": "ok", "data": data})
}

fn cli_error_code(failure: &CliFailure) -> &'static str {
    if failure.code == EXIT_USAGE && failure.message.starts_with("unknown command `") {
        return "unknown_command";
    }
    match failure.code {
        EXIT_USAGE => "usage",
        EXIT_DAEMON_UNAVAILABLE => "daemon_unavailable",
        EXIT_REJECTED => "rejected",
        EXIT_NOT_FOUND => "not_found",
        EXIT_LOCAL_IO => "local_io",
        _ => "operation_failed",
    }
}

fn cli_error_json(failure: &CliFailure, message: &str) -> Value {
    json!({
        "status": "error",
        "error": {
            "code": cli_error_code(failure),
            "message": message,
            "details": {},
        }
    })
}

struct CliPresenter {
'''
          if old not in text:
              raise SystemExit('CliResult presenter anchor missing')
          text = text.replace(old, new, 1)

          old = '''    fn success(&self, command: &str, data: Value) -> CliResult<()> {
        if self.options.quiet {
            return Ok(());
        }
        if self.options.json {
            let value = json!({
                "ok": true,
                "command": command,
                "data": data,
            });
            println!(
                "{}",
                serde_json::to_string_pretty(&value).map_err(anyhow::Error::from)?
            );
            return Ok(());
        }
        render_human(&data);
        Ok(())
    }
'''
          new = '''    fn success(&self, _command: &str, data: Value) -> CliResult<()> {
        if self.options.quiet {
            return Ok(());
        }
        if self.options.json {
            println!(
                "{}",
                serde_json::to_string_pretty(&cli_success_json(data))
                    .map_err(anyhow::Error::from)?
            );
            return Ok(());
        }
        render_human(&data);
        Ok(())
    }
'''
          if old not in text:
              raise SystemExit('success presenter block missing')
          text = text.replace(old, new, 1)

          old = '''        if self.options.json && !self.options.quiet {
            let code = match failure.code {
                EXIT_USAGE => "usage",
                EXIT_DAEMON_UNAVAILABLE => "daemon_unavailable",
                EXIT_REJECTED => "rejected",
                EXIT_NOT_FOUND => "not_found",
                EXIT_LOCAL_IO => "local_io",
                _ => "error",
            };
            eprintln!(
                "{}",
                serde_json::to_string(&json!({
                    "ok": false,
                    "error": {"code": code, "message": message},
                }))
                .unwrap_or_else(|_| "{\\\"ok\\\":false}".into())
            );
'''
          new = '''        if self.options.json && !self.options.quiet {
            eprintln!(
                "{}",
                serde_json::to_string(&cli_error_json(failure, &message)).unwrap_or_else(|_| {
                    r#"{"status":"error","error":{"code":"serialization_error","message":"unable to serialize CLI error","details":{}}}"#.into()
                })
            );
'''
          if old not in text:
              raise SystemExit('error presenter block missing')
          text = text.replace(old, new, 1)

          marker = '''    #[test]
    fn app_json_schema_does_not_expose_view_buttons() {
'''
          contract_test = '''    #[test]
    fn cli_json_contract_matches_architecture_schema() {
        let success = cli_success_json(json!({"answer": "hello"}));
        assert_eq!(success.get("status").and_then(Value::as_str), Some("ok"));
        assert_eq!(success.pointer("/data/answer").and_then(Value::as_str), Some("hello"));
        assert!(success.get("ok").is_none());
        assert!(success.get("command").is_none());

        let failure = unknown_command("stats");
        let error = cli_error_json(&failure, &failure.message);
        assert_eq!(error.get("status").and_then(Value::as_str), Some("error"));
        assert_eq!(
            error.pointer("/error/code").and_then(Value::as_str),
            Some("unknown_command")
        );
        assert!(error.pointer("/error/details").is_some_and(Value::is_object));
        assert!(error.get("ok").is_none());
    }

'''
          if marker not in text:
              raise SystemExit('JSON test insertion marker missing')
          text = text.replace(marker, contract_test + marker, 1)
          path.write_text(text)

          integration = Path('tests/cli_integration.rs')
          it = integration.read_text()
          it = it.replace('''    assert_eq!(value.get("ok").and_then(|v| v.as_bool()), Some(false));
    assert_eq!(value.pointer("/error/code").and_then(|v| v.as_str()), Some("usage"));
''', '''    assert_eq!(value.get("status").and_then(|v| v.as_str()), Some("error"));
