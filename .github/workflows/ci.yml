name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-v027:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/v0.2.7-control-plane-unification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - name: Apply checksum-bound v0.2.7 implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/v2-00 \
            .bootstrap/v2-01a \
            .bootstrap/v3-01b0 \
            .bootstrap/v3-01b1 \
            .bootstrap/v2-01c \
            .bootstrap/v2-02 \
            .bootstrap/v2-03 \
            .bootstrap/v2-04 \
            .bootstrap/v2-05 \
            .bootstrap/v3-060 \
            .bootstrap/v3-061 \
            .bootstrap/v3-062 \
            .bootstrap/v3-063 \
            .bootstrap/v3-064 \
            .bootstrap/v3-065 \
            .bootstrap/v2-07 \
            .bootstrap/v2-08 > /tmp/v027.payload.b64
          echo 'b4029528f5c31db3d06760d35c17db3c2f303320d2604f3a87d9bc7934af328d  /tmp/v027.payload.b64' | sha256sum -c -
          base64 --decode /tmp/v027.payload.b64 | xz --decompress > /tmp/v027.patch
          echo 'e39029cd8df8ba46607c1a87da35e7f133404c3e336bfd465a8e5dfa6953553c  /tmp/v027.patch' | sha256sum -c -
          git apply --check /tmp/v027.patch
          git apply /tmp/v027.patch
          rm -rf .bootstrap
          git diff --check
          node --check module/webroot/assets/app.js
          ./scripts/acceptance.sh --static-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: unify Xiao v0.2.7 control plane and CLI'
          git push origin HEAD:feat/v0.2.7-control-plane-unification

  rust:
    needs: bootstrap-v027
    if: always() && needs.bootstrap-v027.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - run: ./scripts/acceptance.sh --static-only

  android-arm64:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Resolve artifact name
        id: module
        run: |
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xiao-v${version}-kernelsu-arm64.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify deterministic module ZIP
        env:
          MODULE_ARCHIVE: ${{ steps.module.outputs.archive }}
        run: |
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$MODULE_ARCHIVE.sha256")
          unzip -t "dist/$MODULE_ARCHIVE"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: xiao-v${{ steps.module.outputs.version }}-kernelsu-arm64
          if-no-files-found: error
          path: |
            dist/${{ steps.module.outputs.archive }}
            dist/${{ steps.module.outputs.archive }}.sha256
