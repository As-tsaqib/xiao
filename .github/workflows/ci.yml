          integration.write_text(it)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin_cli.rs tests/cli_integration.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align CLI JSON with v0.2.7 application schema'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi
