name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Shellcheck POSIX scripts
        run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - name: Shellcheck Bash scripts
        run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --locked --all-targets --all-features
      - name: Cargo test
        run: cargo test --locked --all-targets --all-features
      - name: Strict clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --locked --release --all-features
      - name: WebUI JavaScript syntax
        run: |
          node --check module/webroot/assets/app.js
          node --check module/webroot/assets/ksu-bridge.js
      - name: Static acceptance
        run: ./scripts/acceptance.sh --static-only

  android-arm64:
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust 1.98.0 Android target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Android arm64 release build
        run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Resolve artifact name
        id: module
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xiao-v${version}-kernelsu-arm64.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify deterministic module ZIP
        env:
          MODULE_ARCHIVE: ${{ steps.module.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$MODULE_ARCHIVE.sha256")
          unzip -t "dist/$MODULE_ARCHIVE"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Upload module artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiao-v${{ steps.module.outputs.version }}-kernelsu-arm64
          if-no-files-found: error
          path: |
            dist/${{ steps.module.outputs.archive }}
            dist/${{ steps.module.outputs.archive }}.sha256
