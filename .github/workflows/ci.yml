name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-cli-contract:
    if: github.event.pull_request.head.ref == 'feat/v0.2.7-control-plane-unification' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply architecture CLI JSON contract
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/fix_cli_json.py
          python3 /tmp/fix_cli_json.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin_cli.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align CLI JSON with v0.2.7 application schema'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi
