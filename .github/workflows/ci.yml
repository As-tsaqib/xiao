name: ci
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - name: Apply compiler fixes and persist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected compiler-fix anchor missing in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/control_plane.rs",
              "        let bot = self\n            .storage\n            .setting(TELEGRAM_IDENTITY_KEY)?",
              "        let bot = self\n            .app\n            .storage\n            .setting(TELEGRAM_IDENTITY_KEY)?",
          )
          replace(
              "src/ipc/mod.rs",
              "                include_archived: None,\n            }),",
              "                include_archived: None,\n                session_id: None,\n                id: None,\n            }),",
          )
          replace(
              "src/command/mod.rs",
              '''    let state = |model: &crate::storage::ProviderProfileModelRecord| match field {\n        "native_tools" => model.native_tools_state.as_str(),\n        "structured_output" => model.structured_output_state.as_str(),\n        "continuation" => model.continuation_state.as_str(),\n        "vision" => model.vision_state.as_str(),\n        "file_input" => model.file_input_state.as_str(),\n        _ => "unknown",\n    };''',
              '''    let state = |model: &crate::storage::ProviderProfileModelRecord| -> String {\n        match field {\n            "native_tools" => model.native_tools_state.clone(),\n            "structured_output" => model.structured_output_state.clone(),\n            "continuation" => model.continuation_state.clone(),\n            "vision" => model.vision_state.clone(),\n            "file_input" => model.file_input_state.clone(),\n            _ => "unknown".into(),\n        }\n    };''',
          )
          replace(
              "src/telegram/mod.rs",
              '''            state.capability = Some(crate::providers::ProviderCapabilities::native(\n                "rollback fixture",\n            ));''',
              '''            state.capability = Some(crate::providers::CustomCapabilityProbe {\n                capabilities: crate::providers::ProviderCapabilities::native("rollback fixture"),\n                native_tools: crate::providers::CapabilityState::Supported,\n                structured_output: crate::providers::CapabilityState::Supported,\n                continuation: crate::providers::CapabilityState::Supported,\n                vision: crate::providers::CapabilityState::Unsupported,\n                file_input: crate::providers::CapabilityState::Unsupported,\n            });''',
          )
          replace(
              "src/storage/mod.rs",
              '''                statement\n                    .query_map([], |row| row.get::<_, String>(0))?\n                    .collect::<rusqlite::Result<Vec<_>>>()?''',
              '''                let rows = statement\n                    .query_map([], |row| row.get::<_, String>(0))?\n                    .collect::<rusqlite::Result<Vec<_>>>()?;\n                rows''',
          )
          PY
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/control_plane.rs src/ipc/mod.rs src/command/mod.rs src/telegram/mod.rs src/storage/mod.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: resolve v0.2.7 compiler integration errors'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi
          cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - run: node --check module/webroot/assets/app.js
      - run: ./scripts/acceptance.sh --static-only

  android-arm64:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Resolve artifact name
        id: module
        run: |
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xiao-v${version}-kernelsu-arm64.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify deterministic module ZIP
        env:
          MODULE_ARCHIVE: ${{ steps.module.outputs.archive }}
        run: |
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$MODULE_ARCHIVE.sha256")
          unzip -t "dist/$MODULE_ARCHIVE"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: xiao-v${{ steps.module.outputs.version }}-kernelsu-arm64
          if-no-files-found: error
          path: |
            dist/${{ steps.module.outputs.archive }}
            dist/${{ steps.module.outputs.archive }}.sha256
