name: ci
on:
  push:
    branches:
      - feat/v0.2.7-control-plane-unification
  pull_request:
  workflow_dispatch:

# Temporary pre-release validation workflow. This write permission and the
# autofix/persist step are removed after the source gates pass.
permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - name: Apply mechanical Rust fixes and persist once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/providers/mod.rs")
          text = path.read_text()
          anchor = "\nfn result_state(result: &Result<bool>) -> CapabilityState {"
          helper = '''
#[cfg(test)]
async fn probe_custom_tool_capability(
    base: &str,
    headers: &std::collections::BTreeMap<String, String>,
    api_key: Option<&str>,
    protocol: &str,
    model: &str,
) -> ProviderCapabilities {
    probe_custom_capabilities(base, headers, api_key, protocol, model)
        .await
        .capabilities
}
'''
          if "fn probe_custom_tool_capability(" not in text:
              if anchor not in text:
                  raise SystemExit("test-helper insertion anchor missing")
              path.write_text(text.replace(anchor, helper + anchor, 1))
          PY
          # Only machine-applicable compiler suggestions are accepted here.
          cargo clippy --fix --locked --all-targets --all-features --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply compiler-suggested v0.2.7 fixes'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi
          cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - run: node --check module/webroot/assets/app.js
      - run: node --check module/webroot/assets/ksu-bridge.js
      - run: ./scripts/acceptance.sh --static-only

  android-arm64:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Resolve artifact name
        id: module
        run: |
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xiao-v${version}-kernelsu-arm64.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify deterministic module ZIP
        env:
          MODULE_ARCHIVE: ${{ steps.module.outputs.archive }}
        run: |
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$MODULE_ARCHIVE.sha256")
          unzip -t "dist/$MODULE_ARCHIVE"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: xiao-v${{ steps.module.outputs.version }}-kernelsu-arm64
          if-no-files-found: error
          path: |
            dist/${{ steps.module.outputs.archive }}
            dist/${{ steps.module.outputs.archive }}.sha256
