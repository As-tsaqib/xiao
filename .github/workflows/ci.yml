name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-cli-contract:
    if: github.event.pull_request.head.ref == 'feat/v0.2.7-control-plane-unification' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - name: Patch CLI contract and integration formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bin_cli.rs')
          t = p.read_text()
          if 'fn cli_success_json(' not in t:
              t = t.replace(
                  'type CliResult<T> = std::result::Result<T, CliFailure>;\n\nstruct CliPresenter {',
                  '''type CliResult<T> = std::result::Result<T, CliFailure>;

fn cli_success_json(data: Value) -> Value {
    json!({"status": "ok", "data": data})
}

fn cli_error_code(failure: &CliFailure) -> &'static str {
    if failure.code == EXIT_USAGE && failure.message.starts_with("unknown command `") {
        return "unknown_command";
    }
    match failure.code {
        EXIT_USAGE => "usage",
        EXIT_DAEMON_UNAVAILABLE => "daemon_unavailable",
        EXIT_REJECTED => "rejected",
        EXIT_NOT_FOUND => "not_found",
        EXIT_LOCAL_IO => "local_io",
        _ => "operation_failed",
    }
}

fn cli_error_json(failure: &CliFailure, message: &str) -> Value {
    json!({"status":"error","error":{"code":cli_error_code(failure),"message":message,"details":{}}})
}

struct CliPresenter {''', 1)

              start = t.index('    fn success(&self, command: &str, data: Value) -> CliResult<()> {')
              end = t.index('\n    fn line(&self, value:', start)
              t = t[:start] + '''    fn success(&self, _command: &str, data: Value) -> CliResult<()> {
        if self.options.quiet {
            return Ok(());
        }
        if self.options.json {
            println!(
                "{}",
                serde_json::to_string_pretty(&cli_success_json(data))
                    .map_err(anyhow::Error::from)?
            );
            return Ok(());
        }
        render_human(&data);
        Ok(())
    }
''' + t[end:]

              start = t.index('        if self.options.json && !self.options.quiet {')
              end = t.index('        } else {\n            eprintln!("xiao: {message}");', start)
              t = t[:start] + '''        if self.options.json && !self.options.quiet {
            eprintln!(
                "{}",
                serde_json::to_string(&cli_error_json(failure, &message)).unwrap_or_else(|_| {
                    r#"{"status":"error","error":{"code":"serialization_error","message":"unable to serialize CLI error","details":{}}}"#.into()
                })
            );
''' + t[end:]

              marker = '    #[test]\n    fn app_json_schema_does_not_expose_view_buttons() {'
              contract = '''    #[test]
    fn cli_json_contract_matches_architecture_schema() {
        let success = cli_success_json(json!({"answer": "hello"}));
        assert_eq!(success.get("status").and_then(Value::as_str), Some("ok"));
        assert_eq!(success.pointer("/data/answer").and_then(Value::as_str), Some("hello"));
        assert!(success.get("ok").is_none());
        assert!(success.get("command").is_none());
        let failure = unknown_command("stats");
        let error = cli_error_json(&failure, &failure.message);
        assert_eq!(error.get("status").and_then(Value::as_str), Some("error"));
        assert_eq!(error.pointer("/error/code").and_then(Value::as_str), Some("unknown_command"));
        assert!(error.pointer("/error/details").is_some_and(Value::is_object));
        assert!(error.get("ok").is_none());
    }

'''
              if marker not in t:
                  raise SystemExit('CLI JSON test marker missing')
              t = t.replace(marker, contract + marker, 1)
              p.write_text(t)

          q = Path('tests/cli_integration.rs')
          s = q.read_text()
          s = s.replace('assert_eq!(value.get("ok").and_then(|v| v.as_bool()), Some(false));', 'assert_eq!(value.get("status").and_then(|v| v.as_str()), Some("error"));')
          s = s.replace('Some("usage")', 'Some("unknown_command")')
          if 'error/details' not in s:
              needle = '    assert!(message.contains("unknown command `stats`"));\n'
              s = s.replace(needle, '    assert!(value.pointer("/error/details").is_some_and(|v| v.is_object()));\n    assert!(value.get("ok").is_none());\n' + needle, 1)
          # rustfmt-compatible layout for the two long command builders.
          s = s.replace('let output = xiao().args(["stats", "--json"]).output().expect("run json typo");', '''let output = xiao()
        .args(["stats", "--json"])
        .output()
        .expect("run json typo");''')
          s = s.replace('let output = xiao().args(["model", "custom", "--help"]).output().expect("run subcommand help");', '''let output = xiao()
        .args(["model", "custom", "--help"])
        .output()
        .expect("run subcommand help");''')
          s = s.replace('assert_eq!(value.pointer("/error/code").and_then(|v| v.as_str()), Some("unknown_command"));', '''assert_eq!(
        value.pointer("/error/code").and_then(|v| v.as_str()),
        Some("unknown_command")
    );''')
          s = s.replace('let message = value.pointer("/error/message").and_then(|v| v.as_str()).unwrap_or_default();', '''let message = value
        .pointer("/error/message")
        .and_then(|v| v.as_str())
        .unwrap_or_default();''')
          q.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin_cli.rs tests/cli_integration.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align CLI JSON with v0.2.7 application schema'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi
