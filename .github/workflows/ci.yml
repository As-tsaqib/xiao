name: ci
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - run: shellcheck -x -s sh module/*.sh module/termux/xiao-wrapper scripts/device-custom-e2e.sh
      - run: shellcheck -s bash packaging/build-module.sh scripts/acceptance.sh
      - name: Apply strict-clippy fixes and persist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected clippy-fix anchor missing in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/providers/mod.rs",
              '''pub(crate) async fn probe_custom_tool_capability(\n    base: &str,\n    headers: &std::collections::BTreeMap<String, String>,\n    api_key: Option<&str>,\n    protocol: &str,\n    model: &str,\n) -> ProviderCapabilities {\n    probe_custom_capabilities(base, headers, api_key, protocol, model)\n        .await\n        .capabilities\n}\n\n''',
              "",
          )
          replace(
              "src/config/mod.rs",
              '''        if self\n            .telegram\n            .access\n            .allowed_chat_ids\n            .iter()\n            .any(|id| *id == 0)\n        {''',
              '''        if self.telegram.access.allowed_chat_ids.contains(&0) {''',
          )
          replace(
              "src/control_plane.rs",
              "            if allowed_chat_ids.iter().any(|id| *id == 0) {",
              "            if allowed_chat_ids.contains(&0) {",
          )
          replace(
              "src/providers/profiles.rs",
              '''        let headers_json = headers\n            .map(|headers| serde_json::to_string(headers))\n            .transpose()?;''',
              '''        let headers_json = headers.map(serde_json::to_string).transpose()?;''',
          )
          replace(
              "src/attachments/mod.rs",
              '''        let mut config = AttachmentConfig::default();\n        config.max_owner_bytes = 70;\n        config.max_global_bytes = 80;\n        config.max_session_bytes = 80;''',
              '''        let config = AttachmentConfig {\n            max_owner_bytes: 70,\n            max_global_bytes: 80,\n            max_session_bytes: 80,\n            ..AttachmentConfig::default()\n        };''',
          )
          replace(
              "src/command/mod.rs",
              "                binding: binding.clone(),",
              "                binding,",
          )
          replace(
              "src/bin_cli.rs",
              "use anyhow::{anyhow, bail, Context, Result};\n",
              "",
          )
          PY
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/mod.rs src/config/mod.rs src/control_plane.rs src/providers/profiles.rs src/attachments/mod.rs src/command/mod.rs src/bin_cli.rs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: satisfy strict clippy for v0.2.7'
            git push origin HEAD:feat/v0.2.7-control-plane-unification
          fi
          cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --all-features
      - run: node --check module/webroot/assets/app.js
      - run: ./scripts/acceptance.sh --static-only

  android-arm64:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --locked --release --bin xiaod --bin xiao
      - name: Resolve artifact name
        id: module
        run: |
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xiao-v${version}-kernelsu-arm64.zip" >> "$GITHUB_OUTPUT"
      - name: Build and verify deterministic module ZIP
        env:
          MODULE_ARCHIVE: ${{ steps.module.outputs.archive }}
        run: |
          ./packaging/build-module.sh
          first_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          ./packaging/build-module.sh
          second_hash=$(sha256sum "dist/$MODULE_ARCHIVE" | awk '{print $1}')
          test "$first_hash" = "$second_hash"
          (cd dist && sha256sum -c "$MODULE_ARCHIVE.sha256")
          unzip -t "dist/$MODULE_ARCHIVE"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: xiao-v${{ steps.module.outputs.version }}-kernelsu-arm64
          if-no-files-found: error
          path: |
            dist/${{ steps.module.outputs.archive }}
            dist/${{ steps.module.outputs.archive }}.sha256
