name: v0.2.7 branch patch shuttle

on:
  push:
    branches:
      - feat/v0.2.7-control-plane-unification

permissions:
  contents: write

concurrency:
  group: v027-branch-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/v0.2.7-control-plane-unification
          fetch-depth: 0

      - name: Apply checksum-bound patch when ready
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/v0.2.7-control-plane-unification"
          if [[ ! -f .bootstrap/READY ]]; then
            echo "No ready patch; nothing to apply."
            exit 0
          fi
          test -f .bootstrap/SHA256
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name '*.xz.b64.*' -print | sort)
          (( ${#parts[@]} > 0 ))
          cat "${parts[@]}" | tr -d '\n\r' | base64 --decode | xz --decompress > /tmp/v027.patch
          sha256sum --check .bootstrap/SHA256
          git apply --check /tmp/v027.patch
          git apply /tmp/v027.patch
          rm -rf .bootstrap
          git diff --check
          node --check module/webroot/assets/app.js
          ./scripts/acceptance.sh --static-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Patch produced no changes."
            exit 0
          fi
          git commit -m 'feat: unify Xiao v0.2.7 control plane and CLI'
          git push origin HEAD:feat/v0.2.7-control-plane-unification
